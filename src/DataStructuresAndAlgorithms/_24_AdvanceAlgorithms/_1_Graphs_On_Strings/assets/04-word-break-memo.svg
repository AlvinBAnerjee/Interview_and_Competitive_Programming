<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#fcfcfb"/>
<defs>
<marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker>
<marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a3aa7"/></marker>
<marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1baf7a"/></marker>
<marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9791a"/></marker>
</defs>
<text x="24" y="32" font-size="17" fill="#0b0b0b" font-weight="700">Word Break — the Trie only tells rec() where a word ends; a HashMap memoizes rec(idx)</text>
<text x="24" y="53" font-size="13" fill="#52514e">s = "catsandog", wordDict = ["cat","cats","and","sand","dog"]. Each arc is one dictionary word, drawn from its left boundary to its right boundary.</text>

<!-- arcs (drawn first, sit behind the grid's white fill) -->
<g>
<path d="M 80,220 Q 176,55 272,220" fill="none" stroke="#4a3aa7" stroke-width="2.2" marker-end="url(#ar-purple)"/>
<text x="176" y="90" text-anchor="middle" font-size="12.5" fill="#4a3aa7" font-weight="700">"cats" → rec(4)</text>

<path d="M 80,220 Q 152,125 224,220" fill="none" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#ar-blue)"/>
<text x="130" y="148" text-anchor="middle" font-size="12.5" fill="#2a78d6" font-weight="700">"cat" → rec(3)</text>

<path d="M 224,220 Q 320,125 416,220" fill="none" stroke="#1baf7a" stroke-width="2.2" marker-end="url(#ar-green)"/>
<text x="300" y="148" text-anchor="middle" font-size="12.5" fill="#1baf7a" font-weight="700">"sand" → rec(7)</text>

<path d="M 272,220 Q 344,168 416,220" fill="none" stroke="#c9791a" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#ar-orange)"/>
<text x="380" y="196" text-anchor="middle" font-size="12" fill="#c9791a" font-weight="700">"and" → rec(7) memo hit</text>

<text x="434" y="205" text-anchor="middle" font-size="15" fill="#c0503f" font-weight="700">✗</text>
</g>

<!-- string cells -->
<g font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace">
<g stroke="#d8d3c4" stroke-width="1.4">
<rect x="80" y="220" width="432" height="50" fill="#ffffff"/>
<line x1="128" y1="220" x2="128" y2="270"/><line x1="176" y1="220" x2="176" y2="270"/><line x1="224" y1="220" x2="224" y2="270"/><line x1="272" y1="220" x2="272" y2="270"/><line x1="320" y1="220" x2="320" y2="270"/><line x1="368" y1="220" x2="368" y2="270"/><line x1="416" y1="220" x2="416" y2="270"/><line x1="464" y1="220" x2="464" y2="270"/>
</g>
<g font-size="20" fill="#2a2620" text-anchor="middle" font-weight="600">
<text x="104" y="252">c</text><text x="152" y="252">a</text><text x="200" y="252">t</text><text x="248" y="252">s</text><text x="296" y="252">a</text><text x="344" y="252">n</text><text x="392" y="252">d</text><text x="440" y="252">o</text><text x="488" y="252">g</text>
</g>
<g font-size="11.5" fill="#8a8577" text-anchor="middle">
<text x="80" y="288">0</text><text x="128" y="288">1</text><text x="176" y="288">2</text><text x="224" y="288">3</text><text x="272" y="288">4</text><text x="320" y="288">5</text><text x="368" y="288">6</text><text x="416" y="288">7</text><text x="464" y="288">8</text><text x="512" y="288">9</text>
</g>
</g>

<text x="80" y="330" font-size="12.5" fill="#6b6455">rec(7): s[7]='o', root.next['o'] == null → map.put(7,false) immediately. No word in the dict starts with 'o'.</text>

<!-- call tree -->
<line x1="24" y1="358" x2="976" y2="358" stroke="#e4ddcd" stroke-width="1.2"/>
<text x="24" y="384" font-size="14" fill="#0b0b0b" font-weight="700">Call tree — rec(7) is computed once, then reused</text>

<g font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace" font-size="13.5" fill="#2a2620">
<text x="40" y="414">rec(0)</text>
<text x="64" y="438"><tspan fill="#2a78d6" font-weight="700">"cat"</tspan> → rec(3)</text>
<text x="96" y="460"><tspan fill="#1baf7a" font-weight="700">"sand"</tspan> → rec(7) → computes false, <tspan fill="#3a352c" font-weight="700">map.put(7, false)</tspan></text>
<text x="64" y="484">rec(3) has no other word starting at idx 3 → false</text>
<text x="64" y="512"><tspan fill="#4a3aa7" font-weight="700">"cats"</tspan> → rec(4)</text>
<text x="96" y="534"><tspan fill="#c9791a" font-weight="700">"and"</tspan> → rec(7) → <tspan fill="#c9791a" font-weight="700">map.containsKey(7)</tspan> → return false, 0 new calls</text>
<text x="40" y="558">rec(0) exhausts both branches → wordBreak(s, wordDict) = false</text>
</g>
</svg>
