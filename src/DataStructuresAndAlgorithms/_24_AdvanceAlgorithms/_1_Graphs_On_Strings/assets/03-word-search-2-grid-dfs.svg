<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#fcfcfb"/>
<defs>
<marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a3aa7"/></marker>
<marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker>
<marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0503f"/></marker>
</defs>
<text x="24" y="32" font-size="17" fill="#0b0b0b" font-weight="700">The Trie pointer walks in lockstep with the grid pointer</text>
<text x="24" y="53" font-size="13" fill="#52514e">rec(board, a, b, curr.next[ch], word, len+1) only fires when the Trie already has that child — a missing child prunes before any call is made.</text>

<!-- grid -->
<g font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace">
<g stroke="#d8d3c4" stroke-width="1.4">
<line x1="60" y1="90" x2="316" y2="90"/><line x1="60" y1="154" x2="316" y2="154"/><line x1="60" y1="218" x2="316" y2="218"/><line x1="60" y1="282" x2="316" y2="282"/><line x1="60" y1="346" x2="316" y2="346"/>
<line x1="60" y1="90" x2="60" y2="346"/><line x1="124" y1="90" x2="124" y2="346"/><line x1="188" y1="90" x2="188" y2="346"/><line x1="252" y1="90" x2="252" y2="346"/><line x1="316" y1="90" x2="316" y2="346"/>
</g>
<g font-size="20" fill="#2a2620" text-anchor="middle" font-weight="600">
<text x="92" y="128">o</text><text x="156" y="128">a</text><text x="220" y="128">a</text><text x="284" y="128">n</text>
<text x="92" y="192">e</text><text x="156" y="192">t</text><text x="220" y="192">a</text><text x="284" y="192">e</text>
<text x="92" y="256">i</text><text x="156" y="256">h</text><text x="220" y="256">k</text><text x="284" y="256">r</text>
<text x="92" y="320">i</text><text x="156" y="320">f</text><text x="220" y="320">l</text><text x="284" y="320">v</text>
</g>

<!-- oath path: (0,0)->(0,1)->(1,1)->(2,1) purple -->
<g stroke="#4a3aa7" stroke-width="2.6" fill="none" marker-end="url(#ar-purple)">
<line x1="104" y1="122" x2="144" y2="122"/>
<line x1="156" y1="134" x2="156" y2="176"/>
<line x1="156" y1="198" x2="156" y2="240"/>
</g>
<!-- eat path: (1,3)->(1,2)->(1,1) blue, curved to avoid dead overlap with purple vertical -->
<path d="M 272,186 Q 245,206 232,192" fill="none" stroke="#2a78d6" stroke-width="2.6" marker-end="url(#ar-blue)"/>
<path d="M 208,192 Q 185,206 172,192" fill="none" stroke="#2a78d6" stroke-width="2.6" marker-end="url(#ar-blue)"/>

<!-- prune stub: (0,1) -> (0,2), trie "oa" has no child "a" -->
<path d="M 168,122 L 205,122" stroke="#c0503f" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#ar-red)"/>
<text x="220" y="112" text-anchor="middle" font-size="13" fill="#c0503f" font-weight="700">✗</text>

<!-- skip whole cell n(0,3): root has no 'n' -->
<text x="284" y="112" text-anchor="middle" font-size="13" fill="#c0503f" font-weight="700">✗</text>

<g font-size="12" font-weight="700" fill="#ffffff">
<circle cx="76" cy="106" r="9" fill="#4a3aa7"/><text x="76" y="110" text-anchor="middle">1</text>
<circle cx="140" cy="106" r="9" fill="#4a3aa7"/><text x="140" y="110" text-anchor="middle">2</text>
<circle cx="140" cy="170" r="9" fill="#4a3aa7"/><text x="140" y="174" text-anchor="middle">3</text>
<circle cx="140" cy="234" r="9" fill="#4a3aa7"/><text x="140" y="238" text-anchor="middle">4</text>

<circle cx="268" cy="170" r="9" fill="#2a78d6"/><text x="268" y="174" text-anchor="middle">1</text>
<circle cx="204" cy="170" r="9" fill="#2a78d6"/><text x="204" y="174" text-anchor="middle">2</text>
</g>
</g>
<text x="60" y="368" font-size="11.5" fill="#6b6455">Cell (1,1)='t': 3rd step of "oath",</text>
<text x="60" y="384" font-size="11.5" fill="#6b6455">last step of "eat" — reused across</text>
<text x="60" y="400" font-size="11.5" fill="#6b6455">two separate top-level scans, never</text>
<text x="60" y="416" font-size="11.5" fill="#6b6455">at once (board restores the letter</text>
<text x="60" y="432" font-size="11.5" fill="#6b6455">before the next start cell runs).</text>

<!-- right panel: trie pointer trace -->
<g font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace" font-size="13.5">
<text x="420" y="100" fill="#3a352c" font-weight="700" font-family="system-ui, sans-serif">Trie pointer, step by step</text>
<text x="420" y="130" fill="#4a3aa7" font-weight="700">"oath"</text>
<text x="420" y="150" fill="#2a2620">root -o→ o -a→ oa -t→ oat -h→ <tspan fill="#4a3aa7" font-weight="700">oath ✓</tspan></text>

<text x="420" y="190" fill="#2a78d6" font-weight="700">"eat"</text>
<text x="420" y="210" fill="#2a2620">root -e→ e -a→ ea -t→ <tspan fill="#2a78d6" font-weight="700">eat ✓</tspan></text>

<text x="420" y="250" fill="#c0503f" font-weight="700">pruned before any call</text>
<text x="420" y="270" fill="#2a2620">(0,1)→(0,2): node "oa".next['a'] == null</text>
<text x="420" y="288" fill="#2a2620">→ skip, 0 recursive calls (Word Search I would</text>
<text x="420" y="306" fill="#2a2620">still call rec() here and fail one level deeper)</text>

<text x="420" y="340" fill="#c0503f" font-weight="700">whole cell skipped</text>
<text x="420" y="360" fill="#2a2620">board[0][3] = 'n': root.next['n'] == null</text>
<text x="420" y="378" fill="#2a2620">→ the top-level loop never even starts a DFS here</text>
</g>
</svg>
