<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 585" width="1000" height="585" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#fcfcfb"/>
<defs>
<marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker>
<marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9791a"/></marker>
</defs>
<text x="24" y="32" font-size="17" fill="#0b0b0b" font-weight="700">Word Ladder II — graph stores child → predecessors; dfs(endWord) walks it backwards</text>
<text x="24" y="53" font-size="13" fill="#52514e">graph[word] holds its BFS predecessors. dfs only steps to prev when levels[prev]+1 == levels[word] — the guard that keeps every path shortest.</text>

<g font-size="12" fill="#8a8577" text-anchor="middle">
<text x="110" y="90">level 0</text>
<text x="310" y="90">level 1</text>
<text x="510" y="90">level 2</text>
<text x="710" y="90">level 3</text>
<text x="910" y="90">level 4</text>
</g>

<!-- reversed edges: child -> predecessor -->
<g stroke-width="2.4" fill="none">
<line x1="284" y1="220" x2="136" y2="220" stroke="#8a8577" marker-end="url(#ar-blue)" marker-start="none"/>
<line x1="484" y1="150" x2="336" y2="208" stroke="#2a78d6" marker-end="url(#ar-blue)"/>
<line x1="484" y1="290" x2="336" y2="232" stroke="#c9791a" marker-end="url(#ar-orange)"/>
<line x1="684" y1="140" x2="536" y2="140" stroke="#2a78d6" marker-end="url(#ar-blue)"/>
<line x1="684" y1="300" x2="536" y2="300" stroke="#c9791a" marker-end="url(#ar-orange)"/>
<line x1="884" y1="208" x2="736" y2="150" stroke="#2a78d6" marker-end="url(#ar-blue)"/>
<line x1="884" y1="232" x2="736" y2="290" stroke="#c9791a" marker-end="url(#ar-orange)"/>
</g>

<g font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">
<circle cx="110" cy="220" r="26" fill="#e4ddcd" stroke="#52514e" stroke-width="1.8"/><text x="110" y="226" fill="#2a2620">hit</text>
<circle cx="310" cy="220" r="26" fill="#f0efec" stroke="#52514e" stroke-width="1.8"/><text x="310" y="226" fill="#2a2620">hot</text>
<circle cx="510" cy="140" r="26" fill="#f0efec" stroke="#52514e" stroke-width="1.8"/><text x="510" y="146" fill="#2a2620">dot</text>
<circle cx="510" cy="300" r="26" fill="#f0efec" stroke="#52514e" stroke-width="1.8"/><text x="510" y="306" fill="#2a2620">lot</text>
<circle cx="710" cy="140" r="26" fill="#f0efec" stroke="#52514e" stroke-width="1.8"/><text x="710" y="146" fill="#2a2620">dog</text>
<circle cx="710" cy="300" r="26" fill="#f0efec" stroke="#52514e" stroke-width="1.8"/><text x="710" y="306" fill="#2a2620">log</text>
<circle cx="910" cy="220" r="26" fill="#1baf7a" stroke="#1baf7a" stroke-width="1.8"/><text x="910" y="226" fill="#ffffff">cog</text>
</g>

<text x="24" y="368" font-size="12.5" fill="#6b6455">graph = { hot:[hit], dot:[hot], lot:[hot], dog:[dot], log:[lot], cog:[dog, log] } — arrows above point from each word to its stored predecessors.</text>

<line x1="24" y1="392" x2="976" y2="392" stroke="#e4ddcd" stroke-width="1.2"/>
<text x="24" y="418" font-size="14" fill="#0b0b0b" font-weight="700">dfs(word, beginWord, path) — path.addFirst(word) builds each sentence in forward order automatically</text>

<g font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace" font-size="13.5" fill="#2a2620">
<text x="40" y="446">dfs(<tspan fill="#1baf7a" font-weight="700">cog</tspan>, path=[cog])</text>
<text x="64" y="468">prev=<tspan fill="#2a78d6" font-weight="700">dog</tspan> (levels[dog]+1==levels[cog] ✓) → dfs(dog, [dog,cog])</text>
<text x="96" y="490">prev=<tspan fill="#2a78d6" font-weight="700">dot</tspan> → dfs(dot, [dot,dog,cog])</text>
<text x="128" y="512">prev=<tspan fill="#2a78d6" font-weight="700">hot</tspan> → dfs(hot, [hot,dot,dog,cog])</text>
<text x="160" y="534">prev=<tspan fill="#2a78d6" font-weight="700">hit</tspan> == beginWord → result += [hit,hot,dot,dog,cog]</text>
<text x="64" y="556">prev=<tspan fill="#c9791a" font-weight="700">log</tspan> → dfs(log,[log,cog]) → lot → hit → result += [hit,hot,lot,log,cog]</text>
</g>
</svg>
