<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#fcfcfb"/>
<defs>
<marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker>
<marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a3aa7"/></marker>
</defs>
<text x="24" y="32" font-size="17" fill="#0b0b0b" font-weight="700">Word Break II — two sentences are two independent walks over the same string</text>
<text x="24" y="53" font-size="13" fill="#52514e">s = "catsanddog". No memo table here (paths, not a yes/no, are the answer) — idx 7 is reached twice and "dog" is explored twice, independently.</text>

<!-- arcs -->
<g>
<path d="M 80,220 Q 152,170 224,220" fill="none" stroke="#2a78d6" stroke-width="2.4" marker-end="url(#ar-blue)"/>
<text x="152" y="180" text-anchor="middle" font-size="12.5" fill="#2a78d6" font-weight="700">"cat"</text>

<path d="M 224,220 Q 320,170 416,220" fill="none" stroke="#2a78d6" stroke-width="2.4" marker-end="url(#ar-blue)"/>
<text x="320" y="180" text-anchor="middle" font-size="12.5" fill="#2a78d6" font-weight="700">"sand"</text>

<path d="M 416,220 Q 488,170 560,220" fill="none" stroke="#2a78d6" stroke-width="2.4" marker-end="url(#ar-blue)"/>
<text x="500" y="180" text-anchor="middle" font-size="12.5" fill="#2a78d6" font-weight="700">"dog"</text>

<path d="M 80,220 Q 176,80 272,220" fill="none" stroke="#4a3aa7" stroke-width="2.4" marker-end="url(#ar-purple)"/>
<text x="176" y="95" text-anchor="middle" font-size="12.5" fill="#4a3aa7" font-weight="700">"cats"</text>

<path d="M 272,220 Q 344,80 416,220" fill="none" stroke="#4a3aa7" stroke-width="2.4" marker-end="url(#ar-purple)"/>
<text x="344" y="95" text-anchor="middle" font-size="12.5" fill="#4a3aa7" font-weight="700">"and"</text>

<path d="M 416,220 Q 488,80 560,220" fill="none" stroke="#4a3aa7" stroke-width="2.4" marker-end="url(#ar-purple)"/>
<text x="500" y="95" text-anchor="middle" font-size="12.5" fill="#4a3aa7" font-weight="700">"dog"</text>

<circle cx="416" cy="220" r="5" fill="#c0503f"/>
<text x="416" y="205" text-anchor="middle" font-size="11.5" fill="#c0503f" font-weight="700">idx 7, shared</text>
</g>

<!-- string cells -->
<g font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace">
<g stroke="#d8d3c4" stroke-width="1.4">
<rect x="80" y="220" width="480" height="50" fill="#ffffff"/>
<line x1="128" y1="220" x2="128" y2="270"/><line x1="176" y1="220" x2="176" y2="270"/><line x1="224" y1="220" x2="224" y2="270"/><line x1="272" y1="220" x2="272" y2="270"/><line x1="320" y1="220" x2="320" y2="270"/><line x1="368" y1="220" x2="368" y2="270"/><line x1="416" y1="220" x2="416" y2="270"/><line x1="464" y1="220" x2="464" y2="270"/><line x1="512" y1="220" x2="512" y2="270"/>
</g>
<g font-size="20" fill="#2a2620" text-anchor="middle" font-weight="600">
<text x="104" y="252">c</text><text x="152" y="252">a</text><text x="200" y="252">t</text><text x="248" y="252">s</text><text x="296" y="252">a</text><text x="344" y="252">n</text><text x="392" y="252">d</text><text x="440" y="252">d</text><text x="488" y="252">o</text><text x="536" y="252">g</text>
</g>
<g font-size="11.5" fill="#8a8577" text-anchor="middle">
<text x="80" y="288">0</text><text x="224" y="288">3</text><text x="272" y="288">4</text><text x="416" y="288">7</text><text x="560" y="288">10</text>
</g>
</g>

<line x1="24" y1="330" x2="976" y2="330" stroke="#e4ddcd" stroke-width="1.2"/>
<g font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace" font-size="14.5">
<text x="24" y="360" fill="#2a78d6" font-weight="700">"cat sand dog"</text>
<text x="24" y="381" fill="#52514e" font-size="12.5" font-family="system-ui, sans-serif">rec(0,[]) → rec(3,["cat"]) → rec(7,["cat","sand"])</text>
<text x="24" y="399" fill="#52514e" font-size="12.5" font-family="system-ui, sans-serif">→ rec(10,["cat","sand","dog"]) → idx==len → join, add to ans</text>

<text x="24" y="430" fill="#4a3aa7" font-weight="700">"cats and dog"</text>
<text x="24" y="451" fill="#52514e" font-size="12.5" font-family="system-ui, sans-serif">rec(0,[]) → rec(4,["cats"]) → rec(7,["cats","and"])</text>
<text x="24" y="469" fill="#52514e" font-size="12.5" font-family="system-ui, sans-serif">→ rec(10,["cats","and","dog"]) → idx==len → join, add to ans</text>
</g>
<text x="24" y="500" font-size="12" fill="#6b6455">temp.add / temp.remove(size-1) around each rec call is the same choose → explore → un-choose shape as plain backtracking — the string just supplies the choices.</text>
</svg>
