<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#fcfcfb"/>
<defs>
<marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker>
<marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/></marker>
<marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c0503f"/></marker>
</defs>

<text x="24" y="32" font-size="17" fill="#0b0b0b" font-weight="700">Word Search (LC 79) — mark, recurse, unmark</text>
<text x="24" y="53" font-size="13" fill="#52514e">grid[i][j] = '.' on the way down; restored on the way back up — that single line *is* the backtracking.</text>

<!-- LEFT PANEL: success -->
<text x="60" y="82" font-size="13.5" fill="#2a78d6" font-weight="700">exist(board, "ABCCED") → true</text>
<g font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace">
<!-- grid lines -->
<g stroke="#d8d3c4" stroke-width="1.4">
<line x1="60" y1="90" x2="284" y2="90"/><line x1="60" y1="146" x2="284" y2="146"/><line x1="60" y1="202" x2="284" y2="202"/><line x1="60" y1="258" x2="284" y2="258"/>
<line x1="60" y1="90" x2="60" y2="258"/><line x1="116" y1="90" x2="116" y2="258"/><line x1="172" y1="90" x2="172" y2="258"/><line x1="228" y1="90" x2="228" y2="258"/><line x1="284" y1="90" x2="284" y2="258"/>
</g>
<!-- letters -->
<g font-size="19" fill="#2a2620" text-anchor="middle" font-weight="600">
<text x="88" y="124">A</text><text x="144" y="124">B</text><text x="200" y="124">C</text><text x="256" y="124">E</text>
<text x="88" y="180">S</text><text x="144" y="180">F</text><text x="200" y="180">C</text><text x="256" y="180">S</text>
<text x="88" y="236">A</text><text x="144" y="236">D</text><text x="200" y="236">E</text><text x="256" y="236">E</text>
</g>
<!-- path arrows: A(88,118)1 -> B(144,118)2 -> C(200,118)3 -> C(200,174)4 -> E(200,230)5 -> D(144,230)6 -->
<g stroke="#2a78d6" stroke-width="2.4" fill="none" marker-end="url(#ar-blue)">
<line x1="100" y1="118" x2="132" y2="118"/>
<line x1="156" y1="118" x2="188" y2="118"/>
<line x1="200" y1="130" x2="200" y2="162"/>
<line x1="200" y1="186" x2="200" y2="218"/>
<line x1="188" y1="230" x2="156" y2="230"/>
</g>
<!-- step badges -->
<g font-size="11" font-weight="700" fill="#ffffff">
<circle cx="70" cy="102" r="9" fill="#2a78d6"/><text x="70" y="106" text-anchor="middle">1</text>
<circle cx="126" cy="102" r="9" fill="#2a78d6"/><text x="126" y="106" text-anchor="middle">2</text>
<circle cx="182" cy="102" r="9" fill="#2a78d6"/><text x="182" y="106" text-anchor="middle">3</text>
<circle cx="218" cy="158" r="9" fill="#2a78d6"/><text x="218" y="162" text-anchor="middle">4</text>
<circle cx="218" cy="214" r="9" fill="#2a78d6"/><text x="218" y="218" text-anchor="middle">5</text>
<circle cx="126" cy="214" r="9" fill="#2a78d6"/><text x="126" y="218" text-anchor="middle">6</text>
</g>
</g>
<text x="60" y="278" font-size="12" fill="#6b6455">idx 0..5 — every step needs grid[a][b] != '.' and a matching</text>
<text x="60" y="294" font-size="12" fill="#6b6455">char at idx+1. Never revisits a cell already on this path.</text>

<!-- RIGHT PANEL: failure + backtrack -->
<text x="560" y="82" font-size="13.5" fill="#c0503f" font-weight="700">exist(board, "ABCB") → false</text>
<g font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace">
<g stroke="#d8d3c4" stroke-width="1.4">
<line x1="560" y1="90" x2="784" y2="90"/><line x1="560" y1="146" x2="784" y2="146"/><line x1="560" y1="202" x2="784" y2="202"/><line x1="560" y1="258" x2="784" y2="258"/>
<line x1="560" y1="90" x2="560" y2="258"/><line x1="616" y1="90" x2="616" y2="258"/><line x1="672" y1="90" x2="672" y2="258"/><line x1="728" y1="90" x2="728" y2="258"/><line x1="784" y1="90" x2="784" y2="258"/>
</g>
<g font-size="19" fill="#2a2620" text-anchor="middle" font-weight="600">
<text x="588" y="124">A</text><text x="644" y="124">B</text><text x="700" y="124">C</text><text x="756" y="124">E</text>
<text x="588" y="180">S</text><text x="644" y="180">F</text><text x="700" y="180">C</text><text x="756" y="180">S</text>
<text x="588" y="236">A</text><text x="644" y="236">D</text><text x="700" y="236">E</text><text x="756" y="236">E</text>
</g>
<!-- forward attempt A(588,118)1 -> B(644,118)2 -> C(700,118)3 dead end -->
<g stroke="#eb6834" stroke-width="2.4" fill="none" marker-end="url(#ar-orange)">
<line x1="600" y1="118" x2="632" y2="118"/>
<line x1="656" y1="118" x2="688" y2="118"/>
</g>
<!-- dead end mark at C(700,118) -->
<text x="700" y="102" text-anchor="middle" font-size="15" fill="#c0503f" font-weight="700">✗</text>
<!-- backtrack curved dashed arrows: 3->2->root -->
<path d="M 700,134 Q 672,150 656,130" fill="none" stroke="#c0503f" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#ar-red)"/>
<path d="M 644,134 Q 616,150 600,130" fill="none" stroke="#c0503f" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#ar-red)"/>
<!-- second start attempt at A(588,236), fails immediately -->
<text x="588" y="220" text-anchor="middle" font-size="15" fill="#c0503f" font-weight="700">✗</text>
<g font-size="11" font-weight="700" fill="#ffffff">
<circle cx="570" cy="102" r="9" fill="#eb6834"/><text x="570" y="106" text-anchor="middle">1</text>
<circle cx="626" cy="102" r="9" fill="#eb6834"/><text x="626" y="106" text-anchor="middle">2</text>
<circle cx="682" cy="102" r="9" fill="#eb6834"/><text x="682" y="106" text-anchor="middle">3</text>
</g>
</g>
<text x="560" y="278" font-size="12" fill="#6b6455">idx 3 needs a 'B' neighbour — none unvisited, dead end.</text>
<text x="560" y="294" font-size="12" fill="#6b6455">Backtrack (dashed): unmark 3, unmark 2, try next start.</text>
<text x="560" y="310" font-size="12" fill="#6b6455">(2,0)'s neighbours are 'S'/'D' — fails before recursing.</text>
</svg>
