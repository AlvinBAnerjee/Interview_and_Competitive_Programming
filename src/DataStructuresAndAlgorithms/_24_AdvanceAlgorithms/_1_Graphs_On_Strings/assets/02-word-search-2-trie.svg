<text x="24" y="32" font-size="17" fill="#0b0b0b" font-weight="700">One Trie for words = ["oath","pea","eat","rain"]</text>
<text x="24" y="53" font-size="13" fill="#52514e">A single DFS from a board cell now explores every word sharing that prefix at once. Filled nodes are isEnd — a word is complete there.</text>

