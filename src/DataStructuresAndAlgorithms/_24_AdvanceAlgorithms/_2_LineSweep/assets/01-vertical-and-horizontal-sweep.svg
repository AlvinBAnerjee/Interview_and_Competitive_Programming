<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#fcfcfb"/>
<defs>
<marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a877f"/></marker>
<marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/></marker>
</defs>

<text x="24" y="32" font-size="17" fill="#0b0b0b" font-weight="700">Line Sweep — one line slides across the axis, stopping only at endpoints</text>
<text x="24" y="53" font-size="13" fill="#52514e">Nothing about the answer changes between two endpoints, so the sweep visits 2n coordinates instead of the whole axis.</text>

<line x1="520" y1="70" x2="520" y2="366" stroke="#e6e1d4" stroke-width="1.4"/>

<!-- ================= LEFT: VERTICAL SWEEP ================= -->
<text x="60" y="80" font-size="13.5" fill="#2a78d6" font-weight="700">Vertical sweep — the line moves left → right along x</text>

<!-- dotted guides from every endpoint down to the axis -->
<g stroke="#ded8c8" stroke-width="1" stroke-dasharray="2 4">
<line x1="110" y1="100" x2="110" y2="246"/><line x1="150" y1="132" x2="150" y2="246"/>
<line x1="190" y1="164" x2="190" y2="246"/><line x1="230" y1="132" x2="230" y2="246"/>
<line x1="310" y1="100" x2="310" y2="246"/><line x1="350" y1="196" x2="350" y2="246"/>
<line x1="430" y1="164" x2="430" y2="246"/><line x1="470" y1="196" x2="470" y2="246"/>
</g>

<!-- interval bars -->
<g stroke="#2a78d6" stroke-width="1.6">
<rect x="110" y="104" width="200" height="20" rx="4" fill="#dce9f9"/>
<rect x="150" y="136" width="80"  height="20" rx="4" fill="#dce9f9"/>
<rect x="190" y="168" width="240" height="20" rx="4" fill="#dce9f9"/>
<rect x="350" y="200" width="120" height="20" rx="4" fill="#f0efe9" stroke="#a8a49a"/>
</g>
<g font-size="11.5" fill="#1d4f8f" font-weight="700" font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace">
<text x="118" y="119">[1, 6)</text>
<text x="158" y="151">[2, 4)</text>
<text x="232" y="183">[3, 9)</text>
<text x="358" y="215" fill="#7a766c">[7, 10)</text>
</g>

<!-- axis -->
<line x1="62" y1="250" x2="490" y2="250" stroke="#8a877f" stroke-width="1.6" marker-end="url(#ar-gray)"/>
<g stroke="#8a877f" stroke-width="1.2">
<line x1="70" y1="246" x2="70" y2="254"/><line x1="110" y1="246" x2="110" y2="254"/><line x1="150" y1="246" x2="150" y2="254"/>
<line x1="190" y1="246" x2="190" y2="254"/><line x1="230" y1="246" x2="230" y2="254"/><line x1="270" y1="246" x2="270" y2="254"/>
<line x1="310" y1="246" x2="310" y2="254"/><line x1="350" y1="246" x2="350" y2="254"/><line x1="390" y1="246" x2="390" y2="254"/>
<line x1="430" y1="246" x2="430" y2="254"/><line x1="470" y1="246" x2="470" y2="254"/>
</g>
<g font-size="10.5" fill="#8a877f" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace">
<text x="70" y="266">0</text><text x="110" y="266">1</text><text x="150" y="266">2</text><text x="190" y="266">3</text>
<text x="230" y="266">4</text><text x="270" y="266">5</text><text x="310" y="266">6</text><text x="350" y="266">7</text>
<text x="390" y="266">8</text><text x="430" y="266">9</text><text x="470" y="266">10</text>
</g>

<!-- signed events -->
<g font-size="11.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace">
<text x="110" y="286" fill="#2a78d6">+1</text><text x="150" y="286" fill="#2a78d6">+1</text>
<text x="190" y="286" fill="#2a78d6">+1</text><text x="350" y="286" fill="#2a78d6">+1</text>
<text x="230" y="286" fill="#c0503f">−1</text><text x="310" y="286" fill="#c0503f">−1</text>
<text x="430" y="286" fill="#c0503f">−1</text><text x="470" y="286" fill="#c0503f">−1</text>
</g>

<!-- the sweep line -->
<line x1="210" y1="94" x2="210" y2="300" stroke="#eb6834" stroke-width="2.4" stroke-dasharray="6 4"/>
<g fill="#eb6834">
<circle cx="210" cy="114" r="3.6"/><circle cx="210" cy="146" r="3.6"/><circle cx="210" cy="178" r="3.6"/>
</g>
<rect x="166" y="308" width="88" height="22" rx="11" fill="#eb6834"/>
<text x="210" y="323" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace">active = 3</text>

<line x1="70" y1="356" x2="470" y2="356" stroke="#8a877f" stroke-width="1.4" marker-end="url(#ar-gray)"/>
<text x="60" y="376" font-size="11.5" fill="#52514e">sort the 2n endpoints, add each signed delta as you pass it</text>

<!-- ================= RIGHT: HORIZONTAL SWEEP ================= -->
<text x="576" y="80" font-size="13.5" fill="#2a78d6" font-weight="700">Horizontal sweep — the line moves top → bottom along y</text>

<!-- dotted guides from every rectangle edge to the axis -->
<g stroke="#ded8c8" stroke-width="1" stroke-dasharray="2 4">
<line x1="594" y1="130" x2="700" y2="130"/><line x1="594" y1="180" x2="620" y2="180"/>
<line x1="594" y1="210" x2="830" y2="210"/><line x1="594" y1="250" x2="700" y2="250"/>
<line x1="594" y1="300" x2="620" y2="300"/><line x1="594" y1="320" x2="830" y2="320"/>
</g>

<!-- rectangles in the plane -->
<g stroke="#2a78d6" stroke-width="1.6">
<rect x="620" y="180" width="140" height="120" rx="4" fill="#dce9f9" fill-opacity="0.85"/>
<rect x="700" y="130" width="180" height="120" rx="4" fill="#dce9f9" fill-opacity="0.7"/>
<rect x="830" y="210" width="140" height="110" rx="4" fill="#f0efe9" stroke="#a8a49a"/>
</g>

<!-- axes -->
<line x1="590" y1="340" x2="590" y2="92" stroke="#8a877f" stroke-width="1.6" marker-end="url(#ar-gray)"/>
<line x1="586" y1="336" x2="1000" y2="336" stroke="#8a877f" stroke-width="1.6" marker-end="url(#ar-gray)"/>
<text x="600" y="104" font-size="10.5" fill="#8a877f" font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace">y</text>
<text x="986" y="354" font-size="10.5" fill="#8a877f" font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace">x</text>

<!-- signed events on the y axis -->
<g font-size="11.5" font-weight="700" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace">
<text x="584" y="134" fill="#2a78d6">+1</text><text x="584" y="184" fill="#2a78d6">+1</text><text x="584" y="214" fill="#2a78d6">+1</text>
<text x="584" y="254" fill="#c0503f">−1</text><text x="584" y="304" fill="#c0503f">−1</text><text x="584" y="324" fill="#c0503f">−1</text>
</g>

<!-- the sweep line -->
<line x1="576" y1="200" x2="998" y2="200" stroke="#eb6834" stroke-width="2.4" stroke-dasharray="6 4"/>
<line x1="620" y1="200" x2="880" y2="200" stroke="#eb6834" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
<rect x="888" y="164" width="88" height="22" rx="11" fill="#eb6834"/>
<text x="932" y="179" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace">active = 2</text>

<line x1="1016" y1="120" x2="1016" y2="310" stroke="#8a877f" stroke-width="1.4" marker-end="url(#ar-gray)"/>
<text x="576" y="376" font-size="11.5" fill="#52514e">same counter, other axis — a rectangle enters at its top edge, leaves at its bottom</text>
</svg>
