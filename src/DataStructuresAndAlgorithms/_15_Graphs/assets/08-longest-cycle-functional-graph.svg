t x="400" y="257" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700">5</text><text x="400" y="273" font-size="10" fill="#2a78d6" text-anchor="middle" font-weight="600">d=6</text><circle cx="190" cy="330" r="26" fill="#f0efec" stroke="#52514e" stroke-width="2"/><text x="190" y="327" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700">8</text><text x="190" y="343" font-size="10" fill="#52514e" text-anchor="middle" font-weight="600">d=9</text><circle cx="630" cy="135" r="26" fill="#fce4d8" stroke="#eb6834" stroke-width="3"/><text x="630" y="132" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700">6</text><text x="630" y="148" font-size="10" fill="#eb6834" text-anchor="middle" font-weight="600">d=7</text><circle cx="630" cy="255" r="26" fill="#fce4d8" stroke="#eb6834" stroke-width="3"/><text x="630" y="252" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700">7</text><text x="630" y="268" font-size="10" fill="#eb6834" text-anchor="middle" font-weight="600">d=8</text><circle cx="540" cy="355" r="26" fill="#f0efec" stroke="#52514e" stroke-width="2"/><text x="540" y="352" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700">9</text><text x="540" y="368" font-size="10" fill="#52514e" text-anchor="middle" font-weight="600">d=10</text><text x="80" y="150" font-size="11" fill="#898781" text-anchor="middle" font-weight="600">walk starts here</text><text x="150" y="296" font-size="11" fill="#898781" text-anchor="end" font-weight="600">disc[1]=2 &lt; timeNow=9</text><text x="150" y="311" font-size="11" fill="#898781" text-anchor="end" font-weight="600">→ old chain, no new cycle</text><text x="612" y="360" font-size="11" fill="#898781" text-anchor="start" font-weight="600">edges[9] = -1</text><text x="395" y="190" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="700">cycle</text><rect x="40" y="400" width="452" height="42" rx="8" fill="#dce9fb" stroke="#2a78d6" stroke-width="1.5"/><text x="58" y="426" font-size="13.5" fill="#2a78d6" text-anchor="start" font-weight="700">longest cycle = time − disc[2] = 7 − 3 = 4   (nodes 2→3→4→5)</text><rect x="508" y="400" width="212" height="42" rx="8" fill="#fce4d8" stroke="#eb6834" stroke-width="1.5"/><text x="526" y="426" font-size="13" fill="#eb6834" text-anchor="start" font-weight="700">second cycle: 9 − 7 = 2</text></svg>