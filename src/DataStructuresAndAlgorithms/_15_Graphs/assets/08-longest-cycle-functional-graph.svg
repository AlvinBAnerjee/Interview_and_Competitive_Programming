<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#fcfcfb"/><defs><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/></marker><marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a78d6"/></marker><marker id="m-org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/></marker></defs><text x="24" y="32" font-size="16.5" fill="#0b0b0b" text-anchor="start" font-weight="700">LeetCode 2360 — functional graph: every node has at most ONE outgoing edge</text><text x="24" y="55" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">edges = [1, 2, 3, 4, 5, 2, 7, 6, 1, -1]</text><text x="290" y="55" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">·   d = the disc timestamp this node was stamped with</text><path d="M 106.0,190.0 Q 135.0,190.0 157.0,190.0" fill="none" stroke="#52514e" stroke-width="2.3" marker-end="url(#m-ink)"/><path d="M 216.0,190.0 Q 250.0,190.0 277.0,190.0" fill="none" stroke="#52514e" stroke-width="2.3" marker-end="url(#m-ink)"/><path d="M 330.5,174.0 Q 355.0,155.0 374.0,140.3" fill="none" stroke="#2a78d6" stroke-width="2.3" marker-end="url(#m-blue)"/><path d="M 420.5,136.0 Q 445.0,155.0 464.0,169.7" fill="none" stroke="#2a78d6" stroke-width="2.3" marker-end="url(#m-blue)"/><path d="M 469.5,206.0 Q 445.0,225.0 426.0,239.7" fill="none" stroke="#2a78d6" stroke-width="2.3" marker-end="url(#m-blue)"/><path d="M 379.5,244.0 Q 355.0,225.0 336.0,210.3" fill="none" stroke="#2a78d6" stroke-width="2.3" marker-end="url(#m-blue)"/><path d="M 190.0,304.0 Q 1