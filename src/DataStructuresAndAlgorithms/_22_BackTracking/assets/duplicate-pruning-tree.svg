b0b0b" text-anchor="middle" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">∅</text><rect x="137.4" y="267.0" width="37.2" height="30" rx="8" fill="#f4f3f0" stroke="#52514e" stroke-width="2"/><text x="156.0" y="287.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[1]</text><rect x="66.0" y="359.0" width="52.0" height="30" rx="8" fill="#f4f3f0" stroke="#52514e" stroke-width="2"/><text x="92.0" y="379.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[1,1]</text><rect x="58.6" y="451.0" width="66.8" height="30" rx="8" fill="#f4f3f0" stroke="#52514e" stroke-width="2"/><text x="92.0" y="471.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[1,1,2]</text><rect x="194.0" y="359.0" width="52.0" height="30" rx="8" fill="#f4f3f0" stroke="#52514e" stroke-width="2"/><text x="220.0" y="379.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[1,2]</text><rect x="329.0" y="267.0" width="38" height="30" rx="8" fill="#fdeeee" stroke="#d03b3b" stroke-width="1.8" stroke-dasharray="5 3"/><text x="348.0" y="287.0" font-size="15" fill="#d03b3b" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">✗</text><rect x="457.4" y="267.0" width="37.2" height="30" rx="8" fill="#f4f3f0" stroke="#52514e" stroke-width="2"/><text x="476.0" y="287.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[2]</text><text x="650.0" y="140.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="700" font-family="system-ui, -apple-s