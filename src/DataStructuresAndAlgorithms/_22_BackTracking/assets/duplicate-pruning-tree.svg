<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 606" width="1180" height="606" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#fcfcfb"/><text x="30.0" y="38.0" font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Subset2 — how the duplicate check prunes the recursion tree</text><text x="30.0" y="62.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Every box is a subset that gets emitted. Each edge is one loop iteration that took a value (the badge).</text><rect x="30" y="76" width="640" height="26" rx="6" fill="#f0efec" stroke="#e1e0d9"/><text x="40.0" y="94.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">for (i = idx; i &lt; n; i++) {  if (i != idx &amp;&amp; arr[i] == arr[i-1]) continue;   …take arr[i], recurse(i+1)…  }</text><text x="30.0" y="140.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">nums = [1,1,2]</text><text x="178.0" y="140.0" font-size="12.5" fill="#898781" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">→ 6 subsets, 1 branch pruned</text><path d="M 316.0,205.0 C 316.0,236.0 156.0,236.0 156.0,267.0" fill="none" stroke="#52514e" stroke-width="2.1"/><circle cx="236.0" cy="236.0" r="11" fill="#dce9fb" stroke="#2a78d6" stroke-width="1.8"/><text x="236.0" y="240.0" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1</text><path d="M 316.0,205.0 C 316.0,236.0 348.0,236.0 348.0,267.0" fill="none" stroke="#d03b3b" str