ont-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">emitted subset</text><rect x="212" y="562" width="34" height="22" rx="6" fill="#fdeeee" stroke="#d03b3b" stroke-width="1.8" stroke-dasharray="5 3"/><text x="256.0" y="578.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">pruned — no call, no subtree, no duplicate</text><circle cx="556" cy="573" r="11" fill="#dce9fb" stroke="#2a78d6" stroke-width="1.8"/><text x="556.0" y="577.0" font-size="12" fill="#2a78d6" text-anchor="middle" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1</text><text x="576.0" y="578.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">the value this iteration appended</text></svg>